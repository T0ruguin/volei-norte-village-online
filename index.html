<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vôlei do Norte Village</title>

<style>
*{box-sizing:border-box;}
body{
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  padding:20px;
  margin:0;
}
.container{max-width:760px;margin:auto;}
h1{text-align:center;margin-bottom:10px;}
.status{
  background:#1e293b;
  border-radius:10px;
  padding:10px;
  margin:10px 0 15px;
  font-size:14px;
  color:#cbd5e1;
}
input, button, select{
  padding:8px;
  border-radius:6px;
  border:none;
  font-size:14px;
}
button{cursor:pointer;font-weight:bold;}
button:disabled{opacity:.55;cursor:not-allowed;}
.add-area,.login-area{
  display:flex;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap;
}
.add-area input,.login-area input{flex:1;min-width:140px;}
.add-area select{background:#334155;color:white;min-width:110px;}
.btn-add{background:#22c55e;color:white;}
.btn-login{background:#38bdf8;color:#082f49;}
.btn-logout{background:#64748b;color:white;}
.btn-importar{background:#f59e0b;color:#1f2937;width:100%;margin-bottom:10px;}
.contador{margin-bottom:10px;font-weight:bold;}
.jogador-item{
  display:flex;
  align-items:center;
  background:#1e293b;
  padding:8px;
  border-radius:8px;
  margin-bottom:5px;
  gap:8px;
}
.presenca{margin-right:2px;}
.jogador-nome{flex:1;word-break:break-word;}
.tag-genero{
  padding:2px 8px;
  border-radius:12px;
  font-size:12px;
  font-weight:bold;
}
.tag-F{background:#ec4899;color:white;}
.tag-M{background:#3b82f6;color:white;}
.nota{width:45px;text-align:right;font-variant-numeric:tabular-nums;}
.btn-editar{background:#f59e0b;color:#1f2937;}
.btn-excluir{background:#ef4444;color:white;}
.btn-acao{background:#3b82f6;color:white;width:100%;margin-top:10px;}
.times{margin-top:20px;}
.time{background:#1e293b;padding:12px;border-radius:8px;margin-bottom:10px;}
.time-espera{
  background:#334155;
  border:2px dashed #f59e0b;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
}
.aviso{font-size:13px;color:#cbd5e1;margin-top:-6px;margin-bottom:12px;line-height:1.4;}
.oculto{display:none!important;}
@media(max-width:600px){
  body{padding:12px;}
  .jogador-item{align-items:center;}
  .btn-editar,.btn-excluir{padding:7px 9px;}
}
</style>
</head>

<body>
<div class="container">

<h1>Vôlei do Norte Village</h1>

<div class="status" id="statusConexao">Conectando ao Firebase...</div>

<div class="login-area" id="areaLogin">
  <input type="email" id="email" placeholder="E-mail do organizador">
  <input type="password" id="senha" placeholder="Senha">
  <button class="btn-login" onclick="loginOrganizador()">Entrar como organizador</button>
</div>

<div class="login-area oculto" id="areaLogado">
  <div style="flex:1; align-self:center; color:#bbf7d0; font-weight:bold;">
    Organizador logado: <span id="emailLogado"></span>
  </div>
  <button class="btn-logout" onclick="logoutOrganizador()">Sair</button>
</div>

<div class="aviso" id="avisoVisitante">
  Visitantes podem visualizar, selecionar jogadores e sortear times. Para adicionar, excluir ou alterar notas, entre como organizador.
</div>

<div class="add-area oculto" id="areaAdicionar">
  <input type="text" id="nome" placeholder="Nome do jogador">
  <select id="genero">
    <option value="M">Masculino</option>
    <option value="F">Feminino</option>
  </select>
  <input type="number" id="nota" placeholder="Nota (1-10)" min="1" max="10" step="0.1">
  <button class="btn-add" onclick="adicionarJogador()">Adicionar</button>
</div>

<button class="btn-importar oculto" id="btnImportar" onclick="importarLocalStorage()">
  Importar jogadores salvos neste aparelho para o banco online
</button>

<div class="contador">
Jogadores selecionados: <span id="contador">0</span>
</div>

<div style="display:flex; gap:10px; margin-bottom:10px;">
  <button onclick="selecionarTodos()" style="flex:1; background:#22c55e; color:white;">
    Selecionar todos
  </button>
  <button onclick="limparSelecao()" style="flex:1; background:#ef4444; color:white;">
    Limpar seleção
  </button>
</div>

<div id="listaJogadores"></div>

<button class="btn-acao" onclick="sortearTimes()">Sortear Times</button>

<div class="times" id="resultado"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZpTp_hwH9FZrU1gRiFwzYS27sjHlokH4",
  authDomain: "volei-norte-village.firebaseapp.com",
  projectId: "volei-norte-village",
  storageBucket: "volei-norte-village.firebasestorage.app",
  messagingSenderId: "434354295194",
  appId: "1:434354295194:web:53bb72273e32aab7de2a23"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, "default");
const jogadoresRef = collection(db, "jogadores");

let jogadores = [];
let usuarioLogado = null;

const statusConexao = document.getElementById("statusConexao");
const areaLogin = document.getElementById("areaLogin");
const areaLogado = document.getElementById("areaLogado");
const areaAdicionar = document.getElementById("areaAdicionar");
const avisoVisitante = document.getElementById("avisoVisitante");
const emailLogado = document.getElementById("emailLogado");
const btnImportar = document.getElementById("btnImportar");

function atualizarTelaLogin(){
  const logado = !!usuarioLogado;
  areaLogin.classList.toggle("oculto", logado);
  areaLogado.classList.toggle("oculto", !logado);
  areaAdicionar.classList.toggle("oculto", !logado);
  avisoVisitante.classList.toggle("oculto", logado);
  btnImportar.classList.toggle("oculto", !logado);
  emailLogado.textContent = usuarioLogado?.email || "";
  renderLista();
}

onAuthStateChanged(auth, (user)=>{
  usuarioLogado = user;
  atualizarTelaLogin();
});

onSnapshot(jogadoresRef, (snapshot)=>{
  jogadores = snapshot.docs.map(d=>({ id:d.id, genero:"M", ...d.data() }));
  jogadores.sort((a,b)=>String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR"));
  statusConexao.textContent = "Lista online carregada. Alterações feitas por organizadores aparecem para todos.";
  renderLista();
}, (error)=>{
  console.error(error);
  statusConexao.textContent = "Erro ao carregar dados: " + error.message;
  alert("Erro ao carregar dados do Firebase: " + error.message);
});

window.loginOrganizador = async function(){
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  if(!email || !senha) return alert("Preencha e-mail e senha.");

  try{
    await signInWithEmailAndPassword(auth, email, senha);
    document.getElementById("senha").value = "";
  }catch(e){
    alert("Não foi possível entrar. Confira o e-mail e a senha.");
  }
}

window.logoutOrganizador = async function(){
  await signOut(auth);
}

window.adicionarJogador = async function(){
  if(!usuarioLogado) return alert("Entre como organizador para adicionar jogadores.");

  const nome = document.getElementById("nome").value.trim();
  const genero = document.getElementById("genero").value;
  const nota = parseFloat(document.getElementById("nota").value);

  if(!nome || isNaN(nota)) return alert("Preencha nome e nota.");
  if(nota < 1 || nota > 10) return alert("A nota precisa estar entre 1 e 10.");

  try{
    await addDoc(jogadoresRef, {
      nome,
      nomeLower: nome.toLowerCase(),
      genero,
      nota
    });
    document.getElementById("nome").value="";
    document.getElementById("nota").value="";
  }catch(e){
    console.error(e);
    alert("Erro ao salvar no Firebase: " + e.message);
  }
}

window.excluir = async function(id){
  if(!usuarioLogado) return alert("Entre como organizador para excluir jogadores.");
  if(!confirm("Tem certeza que deseja excluir este jogador?")) return;
  await deleteDoc(doc(db, "jogadores", id));
}

window.editarNota = async function(id, nome, notaAtual, generoAtual){
  if(!usuarioLogado) return alert("Entre como organizador para editar.");

  const novoGenero = confirm(`Alterar gênero de ${nome}?\nOK = Feminino (F)\nCancelar = Masculino (M)`) ? "F" : "M";

  const novaNotaTexto = prompt(`Nova nota para ${nome} (${novoGenero}):`, Number(notaAtual).toFixed(1));
  if(novaNotaTexto === null) return;

  const novaNota = parseFloat(novaNotaTexto.replace(",", "."));
  if(isNaN(novaNota) || novaNota < 1 || novaNota > 10){
    return alert("Digite uma nota válida entre 1 e 10.");
  }

  await updateDoc(doc(db, "jogadores", id), { nota: novaNota, genero: novoGenero });
}

window.importarLocalStorage = async function(){
  if(!usuarioLogado) return alert("Entre como organizador para importar.");

  const locais = JSON.parse(localStorage.getItem("jogadores") || "[]");
  if(!locais.length) return alert("Não encontrei jogadores salvos neste aparelho.");

  if(!confirm(`Importar ${locais.length} jogadores deste aparelho para o banco online?`)) return;

  const existentesSnap = await getDocs(jogadoresRef);
  const nomesExistentes = new Set(existentesSnap.docs.map(d => (d.data().nome || "").toLowerCase().trim()));

  const batch = writeBatch(db);
  let adicionados = 0;

  locais.forEach(j=>{
    const nome = String(j.nome || "").trim();
    const nota = parseFloat(j.nota);
    const genero = j.genero || "M";
    if(!nome || isNaN(nota)) return;
    const chave = nome.toLowerCase();
    if(nomesExistentes.has(chave)) return;

    const novoDoc = doc(jogadoresRef);
    batch.set(novoDoc, { nome, nomeLower: chave, nota, genero });
    nomesExistentes.add(chave);
    adicionados++;
  });

  if(adicionados === 0) return alert("Nenhum jogador novo para importar.");

  try{
    await batch.commit();
    alert(`${adicionados} jogadores importados para o banco online.`);
  }catch(e){
    console.error(e);
    alert("Erro ao importar para o Firebase: " + e.message);
  }
}

window.renderLista = function(){
  const lista = document.getElementById("listaJogadores");
  lista.innerHTML="";

  jogadores.forEach((j)=>{
    const nomeSeguro = String(j.nome).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
    const gen = j.genero === "F" ? "F" : "M";
    lista.innerHTML += `
      <div class="jogador-item">
        <input type="checkbox" class="presenca" data-id="${j.id}" onchange="atualizarContador()">
        <span class="tag-genero tag-${gen}">${gen}</span>
        <div class="jogador-nome">${j.nome}</div>
        <div class="nota">${Number(j.nota).toFixed(1)}</div>
        ${usuarioLogado ? `<button class="btn-editar" onclick="editarNota('${j.id}', '${nomeSeguro}', ${Number(j.nota)}, '${gen}')">Editar</button>` : ""}
        ${usuarioLogado ? `<button class="btn-excluir" onclick="excluir('${j.id}')">X</button>` : ""}
      </div>
    `;
  });

  atualizarContador();
}

window.atualizarContador = function(){
  const selecionados = document.querySelectorAll(".presenca:checked").length;
  document.getElementById("contador").textContent = selecionados;
}

window.selecionarTodos = function(){
  document.querySelectorAll(".presenca").forEach(chk=>{ chk.checked = true; });
  atualizarContador();
}

window.limparSelecao = function(){
  document.querySelectorAll(".presenca").forEach(chk=>{ chk.checked = false; });
  atualizarContador();
}

function embaralhar(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

window.sortearTimes = function(){
  let selecionados = [];

  document.querySelectorAll(".presenca:checked").forEach((chk)=>{
    const id = chk.getAttribute("data-id");
    const jog = jogadores.find(j => j.id === id);
    if(jog) selecionados.push(jog);
  });

  const total = selecionados.length;

  if(total < 12){
    return alert("Selecione no mínimo 12 jogadores para formar ao menos 2 times de 6.");
  }

  // Apenas times fechados em 6
  let numTimes = Math.floor(total / 6);
  if(numTimes > 4) numTimes = 4;

  const vagasTotais = numTimes * 6;
  const numSobras = total - vagasTotais;

  let titulares = [];
  let espera = [];

  if(numSobras > 0){
    embaralhar(selecionados);
    selecionados.sort((a,b) => b.nota - a.nota);

    let copia = [...selecionados];
    for(let s = 0; s < numSobras; s++){
      let indice = Math.floor((s + 0.5) * (copia.length / numSobras));
      espera.push(copia.splice(indice, 1)[0]);
    }
    titulares = copia;
  } else {
    titulares = [...selecionados];
  }

  let times = Array.from({length: numTimes}, () => []);

  // Separa titulares por gênero
  let mulheres = titulares.filter(j => j.genero === "F");
  let homens = titulares.filter(j => j.genero !== "F");

  // Embaralha para que pessoas de notas iguais ou próximas alternem posições
  embaralhar(mulheres);
  mulheres.sort((a,b) => (b.nota - a.nota) + (Math.random() * 0.5 - 0.25));

  embaralhar(homens);
  homens.sort((a,b) => (b.nota - a.nota) + (Math.random() * 0.5 - 0.25));

  // 1. Distribui as mulheres com aleatoriedade no desempate
  for (let m of mulheres) {
    let ordemTimes = embaralhar(Array.from({length: numTimes}, (_, i) => i));
    let melhorTime = null;
    let menorQtdMulheres = Infinity;
    let menorSomaNota = Infinity;

    for (let t of ordemTimes) {
      if (times[t].length >= 6) continue;
      let qtdM = times[t].filter(j => j.genero === "F").length;
      let soma = times[t].reduce((acc, j) => acc + j.nota, 0);

      if (qtdM < menorQtdMulheres || (qtdM === menorQtdMulheres && soma < menorSomaNota)) {
        menorQtdMulheres = qtdM;
        menorSomaNota = soma;
        melhorTime = t;
      }
    }

    if (melhorTime !== null) times[melhorTime].push(m);
  }

  // 2. Preenche com os homens com aleatoriedade no desempate
  for (let h of homens) {
    let ordemTimes = embaralhar(Array.from({length: numTimes}, (_, i) => i));
    let melhorTime = null;
    let menorSomaNota = Infinity;

    for (let t of ordemTimes) {
      if (times[t].length >= 6) continue;
      let soma = times[t].reduce((acc, j) => acc + j.nota, 0);

      if (soma < menorSomaNota) {
        menorSomaNota = soma;
        melhorTime = t;
      }
    }

    if (melhorTime !== null) times[melhorTime].push(h);
  }

  // Sorteia a ordem de exibição dos times (evita que qualquer atleta fique preso no Time 1)
  embaralhar(times);

  // Renderiza os resultados
  let resultado = document.getElementById("resultado");
  resultado.innerHTML = "";

  times.forEach((time, i) => {
    let soma = time.reduce((acc, j) => acc + j.nota, 0);
    let media = (soma / time.length).toFixed(2);
    let qtdM = time.filter(j => j.genero === "F").length;
    let qtdH = time.length - qtdM;

    resultado.innerHTML += `
      <div class="time">
        <strong>Time ${i+1} (${time.length} jogadores)</strong> — <span>${qtdH}M / ${qtdM}F</span><br>
        Média: ${media}<br><br>
        ${time.map(j => `
          ${j.genero === "F" ? "👧" : "👦"} ${j.nome} (${Number(j.nota).toFixed(1)})
        `).join("<br>")}
      </div>
    `;
  });

  if(espera.length > 0){
    resultado.innerHTML += `
      <div class="time-espera">
        <strong>⏳ Próximos / Espera (${espera.length} ${espera.length === 1 ? "jogador" : "jogadores"})</strong><br>
        <small style="color:#fde68a;">Entram nas próximas rotações ou completam desistências:</small><br><br>
        ${espera.map(j => `
          ${j.genero === "F" ? "👧" : "👦"} ${j.nome} (${Number(j.nota).toFixed(1)})
        `).join("<br>")}
      </div>
    `;
  }
}
</script>
</body>
</html>
